<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Demostración local del asistente comercial PASA." />
    <title>PASA · Asistente comercial</title>
    <script>
      (() => {
        let theme;
        try { theme = localStorage.getItem('pasa-theme'); } catch { /* Storage is optional. */ }
        if (theme !== 'light' && theme !== 'dark') {
          try { theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
          catch { theme = 'light'; }
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <style>
      html { background: #eef4fa; color-scheme: light; }
      html[data-theme="dark"] { background: #101e30; color-scheme: dark; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
